version: 2

models:
  - name: dim_creditcard
    description: Dimensão de tipo de cartão de crédito. Contém um registro único para cada tipo de cartão utilizado nas vendas.
    columns:
      - name: credit_card_sk
        description: Chave substituta da dimensão de tipo de cartão de crédito.
        tests:
          - not_null
          - unique

      - name: card_type
        description: Tipo do cartão de crédito (ex Vista, SuperiorCard, Distinguish).
        tests:
          - not_null
          - unique
