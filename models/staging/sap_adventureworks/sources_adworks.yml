version: 2

sources:
  - name: adworks
    database: fea_academy
    schema: adventure_works
    description: Dados transacionais da Adventure Works
    tables:
      - name: sales_salesorderheader
        description: Tabela de pedidos
        columns:
          - name: salesorderid 
            description: Chave primária da tabela de pedidos
            tests: 
             - unique
             - not_null
          - name: orderdate
            description: Data em que o pedido foi realizado
            tests:
              - not_null
          - name: customerid
            description: Chave primária da tabela de clientes
            tests:
              - not_null
          - name: status
            description: Status atual do pedido
            tests:
              - not_null
          - name: creditcardid
            description: Chave primária da tabela de cartões de crédito
            tests:
              - not_null    
          - name: territoryid
            description: Chave primária do território de vendas.
            tests:
              - not_null
          - name: totaldue
            description: Valor total do pedido (incluindo taxas e frete).  
            tests:
              - not_null    

      - name: sales_salesorderdetail
        description: Tabela de detalhes de pedidos
        columns:
          - name: salesorderdetailid
            description: Chave primária da tabela de detalhes de pedidos
            tests: 
             - unique
             - not_null
          - name: salesorderid
            description: Chave primária da tabela de pedidos
            tests:
              - not_null
          - name: productid
            description: Chave primária da tabela de produtos
            tests:
              - not_null
          - name: orderqty
            description: Quantidade comprada do produto.
            tests:
              - not_null
          - name: unitprice
            description: Preço unitário do produto.
            tests:
            - not_null
          - name: unitpricediscount
            description: Desconto aplicado ao produto.
            tests:
            - not_null


      - name: sales_customer
        description: Tabela de clientes
        columns:
          - name: customerid
            description: Chave primária da tabela de clientes
            tests:
              - not_null
              - unique
          - name: personid
            description: Identificador da pessoa associada ao cliente
            tests:
              - not_null


      - name: sales_creditcard
        description: Tabela de cartões de crédito
        columns:
          - name: creditcardid
            description: Chave primária da tabela de cartões de crédito
            tests:
              - not_null
              - unique
          - name: cardtype
            description: Tipo de cartão de crédito


      - name: sales_salesreason
        description: Tabela de motivos de venda
        columns:
          - name: salesreasonid
            description: Chave primária da tabela de motivos de venda
            tests:
              - not_null
              - unique
          - name: name
            description: Nome do motivo da venda


      - name: sales_salesorderheadersalesreason
        description: Tabela de relacionamento entre pedidos de venda e motivos
        columns:
          - name: salesorderid
            description: Chave primária da tabela de pedidos
            tests:
              - not_null
          - name: salesreasonid
            description: Identificador do motivo da venda
            tests:
              - not_null


      - name: production_product
        description: Tabela de detalhes de produtos
        columns: 
          - name: productid
            description: Chave primária da tabela de produtos
            tests:
              - not_null
              - unique
          - name: name
            description: Nome do produto
            tests:
              - not_null
          - name: productsubcategoryid
            description: Identificador da subcategoria do produto
            tests:
              - not_null
        

      - name: prodution_productsubcategory
        description: Tabela de Subcategorias de produtos
        columns:
          - name: productsubcategoryid
            description: Chave primária da subcategoria de produtos
            tests:
              - not_null
              - unique
          - name: productcategoryid
            description: Identificador da categoria do produto.
            tests:
              - not_null


      - name: production_productcategory
        description: Categorias de produtos
        columns:
          - name: productcategoryid
            description: Chave primária da tabela de categoria de produtos
            tests:
              - not_null
              - unique
          - name: name
            description: Nome da categoria do produto
            tests:
              - not_null


      - name: person_person
        description: Informações de clientes
        columns:
          - name: businessentityid
            description: Chave primária da tabela de clientes
            tests:
              - not_null
              - unique
          - name: firstname
            description: Primeiro nome da pessoa.
            tests:
              - not_null
          - name: lastname
            description: Sobrenome da pessoa.
            tests:
              - not_null
            

      - name: person_businessentityaddress
        description: Relacionamento entre pessoas e endereços
        columns:
          - name: businessentityid
            description: Identificador da pessoa
            tests:
              - not_null
          - name: addressid
            description: Chave primária da tabela de endereços
            tests:
              - not_null


      - name: person_address
        description: Endereços dos clientes
        columns:
          - name: addressid
            description: Chave primária da tabela de endereços
            tests:
              - not_null
              - unique
          - name: city
            description: Cidade do endereço
            tests:
              - not_null
          - name: stateprovinceid
            description: Identificador do estado/província
            tests:
              - not_null


      - name: person_stateprovince
        description: Estados dos clientes
        columns:
          - name: stateprovinceid
            description: Chave primaria da tabela de estados
            tests:
              - not_null
              - unique
          - name: name
            description: Nome do estado
            tests:
              - not_null
          - name: countryregioncode
            description: Código do país
            tests:
              - not_null


      - name: countryregion
        description: Países e regiões
        columns:
          - name: countryregioncode
            description: Chave primária da tabela de codigos do país
            tests:
              - not_null
              - unique
          - name: name
            description: Nome do país.
            tests:
              - not_null